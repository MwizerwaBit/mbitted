[alembic]
script_location = alembic
prepend_sys_path = .
# The real URL comes from app.core.config (Settings.database_url); this is a
# fallback that env.py overrides before connecting.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/sample_app

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
